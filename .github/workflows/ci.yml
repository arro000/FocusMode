name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build on macOS
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Validate bundle metadata
        run: plutil -lint App/Info.plist
      - name: Build release
        run: swift build --configuration release
      - name: Run tests with coverage
        run: swift test --enable-code-coverage
