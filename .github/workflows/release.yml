name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app bundle
        run: zsh build-app.sh --no-open

      - name: Create release archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent FocusMode.app FocusMode.zip
          shasum -a 256 FocusMode.zip > FocusMode.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusMode-${{ github.ref_name }}
          path: |
            FocusMode.zip
            FocusMode.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          FocusMode.zip
          FocusMode.zip.sha256
          --verify-tag
          --generate-notes
          --title "FocusMode $GITHUB_REF_NAME"
